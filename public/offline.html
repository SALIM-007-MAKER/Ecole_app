<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#7c3aed">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Hors ligne - Ecole App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-full items-center justify-center bg-slate-100 px-4 py-8 text-slate-900">
    <main class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-xl">
        <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-violet-100 text-3xl text-violet-700">&#128267;</div>
        <h1 class="text-2xl font-bold tracking-tight">Vous etes hors ligne</h1>
        <p class="mt-3 text-sm leading-6 text-slate-500">Votre connexion internet est indisponible. Certaines pages deja visitees restent accessibles.</p>

        <div class="mt-6 flex flex-wrap justify-center gap-3">
            <button class="inline-flex items-center justify-center rounded-lg bg-violet-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-violet-700" onclick="tryReload()">&#8635; Reessayer</button>
            <a href="/ecole_app/" class="inline-flex items-center justify-center rounded-lg border border-violet-200 bg-white px-4 py-2 text-sm font-semibold text-violet-700 transition hover:bg-violet-50">&#8962; Accueil</a>
        </div>

        <div class="mt-6 inline-flex items-center gap-2 rounded-lg bg-slate-100 px-3 py-2 text-xs font-medium text-slate-500">
            <span id="statusDot" class="h-2 w-2 rounded-full bg-red-500"></span>
            <span id="statusText">Connexion perdue</span>
        </div>

        <section id="cachedList" class="mt-6 hidden border-t border-slate-200 pt-4 text-left">
            <h2 class="text-xs font-bold uppercase tracking-wide text-slate-400">Pages disponibles hors ligne</h2>
            <div id="cachedLinks" class="mt-2 divide-y divide-slate-100"></div>
        </section>
    </main>

<script>
'use strict';
const BASE = '/ecole_app';
const KNOWN_PAGES = [
    { url: BASE + '/', label: 'Tableau de bord' },
    { url: BASE + '/eleves', label: 'Eleves' },
    { url: BASE + '/notes', label: 'Notes et evaluations' },
    { url: BASE + '/absences', label: 'Absences' },
    { url: BASE + '/bulletins', label: 'Bulletins' },
    { url: BASE + '/comptabilite', label: 'Finance' },
    { url: BASE + '/emplois-du-temps', label: 'Emploi du temps' },
];
const dot = document.getElementById('statusDot');
const status = document.getElementById('statusText');
function updateStatus() {
    if (navigator.onLine) {
        dot.className = 'h-2 w-2 rounded-full bg-emerald-500';
        status.textContent = 'Connexion retablie - rechargement...';
        setTimeout(() => window.location.reload(), 1000);
    } else {
        dot.className = 'h-2 w-2 rounded-full bg-red-500';
        status.textContent = 'Connexion perdue';
    }
}
function tryReload() { window.location.reload(); }
async function showCachedPages() {
    if (!('caches' in window)) return;
    const cacheNames = await caches.keys();
    const links = [];
    for (const page of KNOWN_PAGES) {
        for (const name of cacheNames) {
            const cache = await caches.open(name);
            const match = await cache.match(page.url);
            if (match) { links.push(page); break; }
        }
    }
    if (!links.length) return;
    const list = document.getElementById('cachedList');
    const container = document.getElementById('cachedLinks');
    list.classList.remove('hidden');
    links.forEach(page => {
        const a = document.createElement('a');
        a.href = page.url;
        a.className = 'block py-2 text-sm font-medium text-violet-700 hover:text-violet-900';
        a.textContent = page.label;
        container.appendChild(a);
    });
}
window.addEventListener('online', updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();
showCachedPages().catch(() => {});
</script>
</body>
</html>
